<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>danse - join</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 0; background: #0e0e10; color: #b9b9c4; font-family: ui-monospace, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    video { display: none; }
    canvas { max-width: 100%; max-height: 100%; object-fit: contain; transform: scaleX(-1); /* mirror */ }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(14, 14, 16, 0.9); z-index: 10; }
    button { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 24px; font-size: 16px; cursor: pointer; letter-spacing: 0.1em; transition: 0.2s; }
    button:hover { background: rgba(255,255,255,0.1); }
    #status { margin-top: 16px; font-size: 12px; letter-spacing: 0.05em; color: #8a8aa8; }
  </style>
</head>
<body>

  <div id="overlay">
    <button id="start-btn">GRANT CAMERA ACCESS</button>
    <div id="status">Waiting to join...</div>
  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script type="module">
    import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const status = document.getElementById("status");
    const startBtn = document.getElementById("start-btn");

    let poseLandmarker = null;
    let runningMode = "VIDEO";

    async function initMediaPipe() {
      status.innerText = "Loading Vision tasks...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task`,
          delegate: "GPU"
        },
        runningMode: runningMode,
        numPoses: 1
      });
      status.innerText = "Model loaded.";
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.addEventListener("loadeddata", predictWebcam);
        overlay.style.display = "none";
      } catch (err) {
        status.innerText = "Camera access denied or unavailable.";
        console.error(err);
      }
    }

    let lastVideoTime = -1;
    function predictWebcam() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      if (poseLandmarker && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        poseLandmarker.detectForVideo(video, video.currentTime * 1000, (result) => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (result.landmarks && result.landmarks.length > 0) {
            // We have a body. In Omega phase, we'd feed this back to the engine.
            // For now, draw skeletal connections to prove capture.
            const marks = result.landmarks[0];

            ctx.fillStyle = "#fff";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.lineWidth = 2;

            // Draw points
            for (const lm of marks) {
              ctx.beginPath();
              ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 3, 0, 2 * Math.PI);
              ctx.fill();
            }

            // Expose via window for local test integration
            window.latestPose = marks;
          }
        });
      }
      requestAnimationFrame(predictWebcam);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      await initMediaPipe();
      await startCamera();
    });
  </script>
</body>
</html>
